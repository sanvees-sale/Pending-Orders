<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders Management Hub</title>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBvrbLXqMHsTG2N3eePFFO900luktM4W60",
            authDomain: "sanveepos.firebaseapp.com",
            databaseURL: "https://sanveepos-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "sanveepos",
            storageBucket: "sanveepos.firebasestorage.app",
            messagingSenderId: "708358963481",
            appId: "1:708358963481:web:4273970ebc8fc8ec6ac588",
            measurementId: "G-75TB9D5L8Q"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.fbSaveOrder = async function(type, dateStr, orders) {
            try {
                await set(ref(db, `orders/${type}/${dateStr}`), orders);
            } catch (error) {
                console.error("Error saving data to Firebase: ", error);
            }
        };

        window.fbLoadOrders = async function(type, dateStr) {
            try {
                const snapshot = await get(child(ref(db), `orders/${type}/${dateStr}`));
                if (snapshot.exists()) {
                    return snapshot.val();
                } else {
                    return null;
                }
            } catch (error) {
                console.error("Error loading data from Firebase: ", error);
                return null;
            }
        };

        window.fbLoadAllDates = async function(type) {
            try {
                const snapshot = await get(child(ref(db), `orders/${type}`));
                if (snapshot.exists()) {
                    return snapshot.val();
                } else {
                    return null;
                }
            } catch (error) {
                console.error("Error loading all dates from Firebase: ", error);
                return null;
            }
        };
    </script>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --border-focus: #818cf8;
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 16px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(226, 232, 240, 0.8);
            position: relative;
        }

        /* Top Bar for Checking Previous Date */
        .top-checking-bar {
            position: absolute;
            top: 32px;
            right: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8fafc;
            padding: 8px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            z-index: 10;
        }

        .top-checking-bar label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .top-checking-bar input[type="date"] {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
            background: white;
            outline: none;
            cursor: pointer;
        }

        /* Tabs Design */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 35px;
            background: #f8fafc;
            padding: 6px;
            border-radius: 14px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid var(--border);
        }

        .tab-btn {
            padding: 10px 24px;
            background-color: transparent;
            color: var(--text-muted);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.25s ease;
        }

        .tab-btn:hover {
            color: var(--text-main);
        }

        .tab-btn.active {
            background-color: white;
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Typography & Header */
        .page-header {
            text-align: center;
            margin-bottom: 30px;
        }

        h2 {
            color: var(--text-main);
            margin: 0;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        /* Form Controls */
        .form-group {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            background: #f8fafc;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid var(--border);
        }

        input[type="text"], input[type="number"] {
            padding: 11px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
            background-color: #fff;
            font-family: inherit;
            color: var(--text-main);
        }

        input[type="text"]:focus, input[type="number"]:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .input-order {
            flex: 2;
            min-width: 180px;
        }

        .input-reason {
            flex: 2;
            min-width: 180px;
        }

        .input-amount {
            flex: 1;
            min-width: 120px;
        }

        .add-btn {
            padding: 11px 22px;
            background-color: #10b981;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 2px 4px rgba(16, 185, 129, 0.2);
        }

        .add-btn:hover {
            background-color: #059669;
        }

        .add-btn:active {
            transform: scale(0.98);
        }

        .print-btn {
            padding: 9px 18px;
            background-color: #334155;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 18px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
            box-shadow: var(--shadow-sm);
        }

        .print-btn:hover {
            background-color: #1e293b;
        }

        /* Table & Inputs */
        .table-container {
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            padding: 14px 16px;
            text-align: center;
            vertical-align: middle;
            font-size: 14px;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f8fafc;
            color: #475569;
            font-weight: 600;
            border-bottom: 2px solid var(--border);
            letter-spacing: -0.01em;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .table-reason-text {
            text-align: center;
            color: var(--text-main);
            font-size: 14px;
            word-break: break-word;
            white-space: pre-wrap;
            padding: 4px;
            line-height: 1.5;
        }

        .table-amount-input {
            width: 95px;
            padding: 6px 10px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            background: #fff;
            color: var(--text-main);
        }

        .table-amount-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        /* Status Dropdown Design */
        .status-select {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid transparent;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
        }

        .status-pending {
            background-color: #fef3c7;
            color: #b45309;
            border-color: #fde68a;
        }

        .status-sent {
            background-color: #d1fae5;
            color: #047857;
            border-color: #a7f3d0;
        }

        .status-cancelled {
            background-color: #fee2e2;
            color: #b91c1c;
            border-color: #fecaca;
        }

        .delete-link {
            background: #fee2e2;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 12px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            margin-left: 8px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .delete-link:hover {
            background: #ef4444;
            color: white;
        }

        /* Total Row Styling */
        .total-row td {
            font-weight: 700;
            background-color: #f8fafc;
            border-top: 2px solid var(--border);
            color: #0f172a;
            font-size: 14px;
        }

        /* Confirmation Custom Modal Styling */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 380px;
            width: 90%;
            animation: modalPop 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalPop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-box h3 {
            margin: 0 0 8px 0;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
        }

        .modal-box p {
            margin: 0 0 24px 0;
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .modal-btn {
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }

        .modal-btn-cancel {
            background-color: #f1f5f9;
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        .modal-btn-cancel:hover {
            background-color: #e2e8f0;
        }

        .modal-btn-confirm {
            background-color: #ef4444;
            color: white;
        }

        .modal-btn-confirm:hover {
            background-color: #dc2626;
        }

        /* Print Settings */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .container {
                box-shadow: none;
                padding: 0;
                max-width: 100%;
                border: none;
            }
            .tabs, .form-group, .print-btn, .delete-link, .top-checking-bar, .modal-overlay {
                display: none !important;
            }
            
            .print-date-title {
                display: block !important;
                text-align: center;
                font-size: 15px;
                font-weight: 600;
                color: #334155;
                margin-bottom: 20px;
            }

            .table-reason-text {
                font-size: 13px;
                text-align: center;
                overflow: visible !important;
                white-space: pre-wrap !important;
                word-break: break-word !important;
            }

            .table-amount-input {
                border: none;
                background: transparent;
                appearance: none;
                padding: 0;
                font-family: inherit;
                font-size: 13px;
                text-align: center;
            }

            .status-select {
                border: none;
                appearance: none;
                padding: 0;
                font-weight: 600;
                text-align-last: center;
            }
            table {
                border-collapse: collapse;
                width: 100%;
            }
            th, td {
                border: 1px solid #cbd5e1 !important;
                padding: 10px;
                text-align: center !important;
                vertical-align: middle !important;
            }
        }

        .print-date-title {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Top Right Checking Date Option -->
    <div class="top-checking-bar">
        <label for="checkDateInput">Check Date:</label>
        <input type="date" id="checkDateInput" onchange="onCheckingDateChange()">
    </div>

    <!-- Tab Buttons -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tony')">Sanvee's by Tony</button>
        <button class="tab-btn" onclick="switchTab('sanvees')">Sanvee's</button>
    </div>

    <!-- TAB 1: Sanvee's by Tony -->
    <div id="tab-tony" class="tab-content active">
        <div class="page-header">
            <h2>Sanvee's by Tony Pending Orders</h2>
        </div>
        <div class="print-date-title" id="printDateTitleTony"></div>
        <div class="form-group">
            <input type="text" id="tonyOrderNo" class="input-order" placeholder="Order Number / Customer Name">
            <input type="text" id="tonyReason" class="input-reason" placeholder="Pending Reason (e.g. Size stock out)">
            <input type="number" id="tonyAmount" class="input-amount" placeholder="Amount (BDT)">
            <button class="add-btn" onclick="addOrder('tony')">Add Order</button>
        </div>
        <button class="print-btn" onclick="preparePrint('tony')">🖨️ Print / Save as PDF</button>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th width="7%">#</th>
                        <th width="28%">Order Number / Details</th>
                        <th width="33%">Pending Reason</th>
                        <th width="14%">Amount</th>
                        <th width="18%">Action / Status</th>
                    </tr>
                </thead>
                <tbody id="tonyTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- TAB 2: Sanvee's -->
    <div id="tab-sanvees" class="tab-content">
        <div class="page-header">
            <h2>Sanvee's Pending Orders</h2>
        </div>
        <div class="print-date-title" id="printDateTitleSanvees"></div>
        <div class="form-group">
            <input type="text" id="sanveesOrderNo" class="input-order" placeholder="Order Number / Customer Name">
            <input type="text" id="sanveesReason" class="input-reason" placeholder="Pending Reason (e.g. Advance missing)">
            <input type="number" id="sanveesAmount" class="input-amount" placeholder="Amount (BDT)">
            <button class="add-btn" onclick="addOrder('sanvees')">Add Order</button>
        </div>
        <button class="print-btn" onclick="preparePrint('sanvees')">🖨️ Print / Save as PDF</button>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th width="7%">#</th>
                        <th width="28%">Order Number / Details</th>
                        <th width="33%">Pending Reason</th>
                        <th width="14%">Amount</th>
                        <th width="18%">Action / Status</th>
                    </tr>
                </thead>
                <tbody id="sanveesTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Custom Confirmation Modal -->
<div id="customConfirmModal" class="modal-overlay">
    <div class="modal-box">
        <h3>Are you sure?</h3>
        <p>Do you really want to delete this order? This action cannot be undone.</p>
        <div class="modal-actions">
            <button class="modal-btn modal-btn-cancel" onclick="closeConfirmModal()">Cancel</button>
            <button class="modal-btn modal-btn-confirm" id="confirmDeleteBtn">Yes, Delete</button>
        </div>
    </div>
</div>

<script>
    let deleteTarget = null;

    document.addEventListener("DOMContentLoaded", async () => {
        const todayStr = new Date().toISOString().split('T')[0];
        
        document.getElementById('checkDateInput').value = todayStr;

        await checkAndCarryForwardPendingOrders('tony', todayStr);
        await checkAndCarryForwardPendingOrders('sanvees', todayStr);

        await loadOrders('tony');
        await loadOrders('sanvees');
    });

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

        if (tabName === 'tony') {
            document.querySelector('.tabs button:nth-child(1)').classList.add('active');
            document.getElementById('tab-tony').classList.add('active');
        } else {
            document.querySelector('.tabs button:nth-child(2)').classList.add('active');
            document.getElementById('tab-sanvees').classList.add('active');
        }
    }

    async function onCheckingDateChange() {
        await loadOrders('tony');
        await loadOrders('sanvees');
    }

    async function checkAndCarryForwardPendingOrders(type, targetDateStr) {
        let allDatesData = await window.fbLoadAllDates(type);
        if (!allDatesData) return;

        let targetDateOrders = allDatesData[targetDateStr] || [];
        let pastDates = Object.keys(allDatesData).filter(d => d < targetDateStr).sort();
        
        let pendingMap = new Map();
        targetDateOrders.forEach(o => pendingMap.set(o.orderNo, o));

        let updated = false;

        for (let pDate of pastDates) {
            let dayOrders = allDatesData[pDate] || [];
            for (let order of dayOrders) {
                let isResolvedLater = false;
                
                for (let checkDate of [...pastDates.filter(d => d > pDate), targetDateStr]) {
                    let checkOrders = allDatesData[checkDate] || [];
                    let foundMatch = checkOrders.find(o => o.orderNo === order.orderNo);
                    if (foundMatch && foundMatch.status !== 'pending') {
                        isResolvedLater = true;
                        break;
                    }
                }

                if (order.status === 'pending' && !isResolvedLater) {
                    if (!pendingMap.has(order.orderNo)) {
                        pendingMap.set(order.orderNo, { 
                            orderNo: order.orderNo, 
                            orderReason: order.orderReason,
                            amount: order.amount !== undefined ? order.amount : 0,
                            status: 'pending' 
                        });
                        updated = true;
                    }
                }
            }
        }

        if (updated || targetDateOrders.length !== pendingMap.size) {
            let finalOrders = Array.from(pendingMap.values());
            await window.fbSaveOrder(type, targetDateStr, finalOrders);
        }
    }

    async function getActiveDate() {
        return document.getElementById('checkDateInput').value;
    }

    async function addOrder(type) {
        let orderNoInput = document.getElementById(type + 'OrderNo');
        let reasonInput = document.getElementById(type + 'Reason');
        let amountInput = document.getElementById(type + 'Amount');
        
        let orderNo = orderNoInput.value.trim();
        let orderReason = reasonInput.value.trim();
        let amount = parseFloat(amountInput.value) || 0;
        let selectedDate = await getActiveDate();

        if (!selectedDate) {
            alert("Please select a date first!");
            return;
        }

        if (orderNo === "" || orderReason === "") {
            alert("Please fill in both Order Number and Reason!");
            return;
        }

        let orders = (await window.fbLoadOrders(type, selectedDate)) || [];
        
        orders.push({ orderNo, orderReason, amount, status: 'pending' });
        await window.fbSaveOrder(type, selectedDate, orders);

        orderNoInput.value = "";
        reasonInput.value = "";
        amountInput.value = "";

        await loadOrders(type);
    }

    async function loadOrders(type) {
        let selectedDate = await getActiveDate();
        if (!selectedDate) return;

        await checkAndCarryForwardPendingOrders(type, selectedDate);

        let orders = (await window.fbLoadOrders(type, selectedDate)) || [];
        let tbody = document.getElementById(type + 'TableBody');
        tbody.innerHTML = "";

        if (orders.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color: var(--text-muted); padding: 30px;">No orders found for this date.</td></tr>`;
            return;
        }

        let pendingTotalAmount = 0;
        let sentTotalAmount = 0;

        orders.forEach((order, index) => {
            let orderAmount = parseFloat(order.amount) || 0;
            
            if (!order.status || order.status === 'pending') {
                pendingTotalAmount += orderAmount;
            } else if (order.status === 'sent') {
                sentTotalAmount += orderAmount;
            }

            let statusClass = 'status-' + order.status;
            let row = `<tr>
                <td>${index + 1}</td>
                <td><b>${order.orderNo}</b></td>
                <td>
                    <div class="table-reason-text">${order.orderReason || ''}</div>
                </td>
                <td>
                    <input type="number" class="table-amount-input" value="${orderAmount}" oninput="updateAmountInline('${type}', ${index}, this)">
                </td>
                <td>
                    <select class="status-select ${statusClass}" onchange="updateStatus('${type}', ${index}, this)">
                        <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>Pending</option>
                        <option value="sent" ${order.status === 'sent' ? 'selected' : ''}>Parcel Sent</option>
                        <option value="cancelled" ${order.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                    </select>
                    <button class="delete-link" onclick="promptDelete('${type}', ${index})" title="Delete">✕</button>
                </td>
            </tr>`;
            tbody.innerHTML += row;
        });

        let totalRows = `<tr class="total-row">
            <td colspan="3" style="text-align: right;">Total Pending Amount:</td>
            <td id="${type}PendingTotalDisplay">৳${pendingTotalAmount.toLocaleString()}</td>
            <td></td>
        </tr>
        <tr class="total-row">
            <td colspan="3" style="text-align: right;">Total Parcel Sent Amount:</td>
            <td id="${type}SentTotalDisplay">৳${sentTotalAmount.toLocaleString()}</td>
            <td></td>
        </tr>`;
        tbody.innerHTML += totalRows;
    }

    async function updateAmountInline(type, index, inputElement) {
        let selectedDate = await getActiveDate();
        let orders = (await window.fbLoadOrders(type, selectedDate)) || [];
        orders[index].amount = parseFloat(inputElement.value) || 0;
        await window.fbSaveOrder(type, selectedDate, orders);

        recalculateTotals(type, orders);
    }

    async function updateStatus(type, index, selectElement) {
        let selectedDate = await getActiveDate();
        let orders = (await window.fbLoadOrders(type, selectedDate)) || [];
        orders[index].status = selectElement.value;
        await window.fbSaveOrder(type, selectedDate, orders);
        selectElement.className = 'status-select status-' + selectElement.value;

        recalculateTotals(type, orders);
    }

    function recalculateTotals(type, orders) {
        let pendingTotalAmount = 0;
        let sentTotalAmount = 0;
        
        orders.forEach(o => {
            let amt = parseFloat(o.amount) || 0;
            if (!o.status || o.status === 'pending') {
                pendingTotalAmount += amt;
            } else if (o.status === 'sent') {
                sentTotalAmount += amt;
            }
        });
        
        document.getElementById(type + 'PendingTotalDisplay').innerText = '৳' + pendingTotalAmount.toLocaleString();
        document.getElementById(type + 'SentTotalDisplay').innerText = '৳' + sentTotalAmount.toLocaleString();
    }

    function promptDelete(type, index) {
        deleteTarget = { type, index };
        document.getElementById('customConfirmModal').style.display = 'flex';
    }

    function closeConfirmModal() {
        document.getElementById('customConfirmModal').style.display = 'none';
        deleteTarget = null;
    }

    document.getElementById('confirmTestBtn').onclick = null; // Clean up
    document.getElementById('confirmDeleteBtn').onclick = async function() {
        if (!deleteTarget) return;
        let { type, index } = deleteTarget;
        
        let selectedDate = await getActiveDate();
        let orders = (await window.fbLoadOrders(type, selectedDate)) || [];
        orders.splice(index, 1);
        await window.fbSaveOrder(type, selectedDate, orders);
        
        closeConfirmModal();
        await loadOrders(type);
    };

    function preparePrint(type) {
        let selectedDate = document.getElementById('checkDateInput').value;
        let titleEl = document.getElementById(type === 'tony' ? 'printDateTitleTony' : 'printDateTitleSanvees');
        
        if (selectedDate) {
            let formattedDate = new Date(selectedDate).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
            titleEl.innerText = "Date: " + formattedDate;
        }
        window.print();
    }
</script>

</body>
</html>
